name: CI

on:
  push:
    # prerelease.yml runs these checks for main before it publishes a prerelease
    branches-ignore: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    - name: Mise install
      uses: jdx/mise-action@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build
      run: task build
    - name: Run Unit Test
      run: task test:unit
    - name: Run Race Detector
      run: task test:race
    - name: Run Integration Test
      run: task test:integration
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: 'internal/frontend/package.json'
    - name: Run Viewer JS Tests
      run: task test:viewer
    - name: Run Viewer Browser E2E Test
      run: task test:e2e:viewer
    - name: Run E2E Test
      run: task test:e2e
