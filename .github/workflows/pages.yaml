# Builds the web viewer, copies it into ./site/static/viewer, builds the Hugo
# site in ./site, and deploys the result to GitHub Pages.
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.156.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Build the web viewer
        run: task build:web
      - name: Inject build version
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          sed -i "s|<!--BUILD_VERSION-->|<script>document.getElementById('stat-commit').textContent='${SHA7}'</script>|" ./web/index.html
      - name: Copy viewer into the site
        run: |
          mkdir -p ./site/static/viewer
          cp -r ./web/. ./site/static/viewer/
      - name: Build with Hugo
        env:
          BASE_URL: "${{ steps.pages.outputs.base_url }}/"
        run: task site:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
