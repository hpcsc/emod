version: '3'

includes:
  release: Taskfile.release.yml

tasks:
  build:
    desc: Build the emod binary
    deps:
      - build:wasm
    cmds:
      - mkdir -p ./bin
      - go build -o ./bin/emod ./cmd/emod
    env:
      CGO_ENABLED: '0'

  build:vscode:
    desc: Compile the VS Code extension (TypeScript → out/)
    dir: editors/vscode
    cmds:
      - npm ci
      - npm run compile

  setup:vscode:
    desc: Compile and symlink the VS Code extension
    deps:
      - build:vscode
    cmds:
      - mkdir -p ~/.vscode/extensions
      - rm -rf ~/.vscode/extensions/hpcsc.emod
      - ln -sf {{.PWD}}/editors/vscode ~/.vscode/extensions/hpcsc.emod

  build:wasm:
    desc: Build the WASM binary and copy runtime glue for the viewer
    cmds:
      - mkdir -p ./internal/frontend/generated
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./internal/frontend/generated/
      - go build -o ./internal/frontend/generated/emod.wasm ./cmd/emod-wasm
    env:
      CGO_ENABLED: '0'
      GOOS: 'js'
      GOARCH: 'wasm'

  # The page is derived from the shared viewer.html rather than written here, so
  # editing that one file changes what all three distributions load. What the sed
  # removes is what only a browser needs: the line loading the WebAssembly glue,
  # and the markers the CLI's server and the Pages deploy substitute into.
  build:desktop:
    desc: Build the native desktop app
    cmds:
      - rm -rf ./cmd/emod-desktop/frontend
      - mkdir -p ./cmd/emod-desktop/frontend/static
      - cp -r ./internal/frontend/static/* ./cmd/emod-desktop/frontend/static/
      - cp ./internal/frontend/desktop/platform.desktop.js ./cmd/emod-desktop/frontend/static/platform.js
      - rm -f ./cmd/emod-desktop/frontend/static/platform.browser.js
      - sed -e '/generated\/wasm_exec.js/d' -e 's|<!--INITIAL_DATA--><!--BUILD_VERSION-->||' ./cmd/emod-desktop/frontend/static/viewer.html > ./cmd/emod-desktop/frontend/index.html
      - rm -f ./cmd/emod-desktop/frontend/static/viewer.html
      - go tool wails3 generate bindings -silent -b -d ./cmd/emod-desktop/frontend/bindings ./cmd/emod-desktop/...
      - go build -o ./bin/emod-desktop ./cmd/emod-desktop
    env:
      CGO_ENABLED: '1'

  build:web:
    desc: Assemble standalone deployment in web/
    deps:
      - build:wasm
    cmds:
      - mkdir -p ./web/generated ./web/static
      - cp -r ./internal/frontend/static/* ./web/static/
      - cp ./internal/frontend/generated/* ./web/generated/
      - mv ./web/static/viewer.html ./web/index.html

  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:viewer
      - task: test:grammar
      - task: test:vscode

  test:unit:
    desc: Run unit tests
    cmds:
      - go test -tags unit $(go list -e ./... | grep -v -e /cmd/emod-wasm -e /cmd/emod-desktop)

  test:integration:
    desc: Run integration tests
    cmds:
      - go test -tags integration $(go list -e ./... | grep -v -e /cmd/emod-wasm -e /cmd/emod-desktop)

  test:viewer:
    desc: Run viewer JS unit tests
    deps:
      - test:viewer:deps
    dir: internal/frontend
    cmds:
      - npm test

  # Reinstalling on every run costs ~18s and reinstates the same 110 packages. The
  # fingerprint is the lockfile, so an unchanged one skips the install entirely.
  test:viewer:deps:
    desc: Install viewer test dependencies when the lockfile has changed
    dir: internal/frontend
    cmds:
      - npm ci
    sources:
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  test:grammar:
    desc: Run the tree-sitter grammar corpus, highlight and editor query tests
    dir: editors/tree-sitter-emod
    cmds:
      - tree-sitter generate
      - tree-sitter test
      # -count=1 because the query files and grammar.js are inputs the Go test
      # cache never sees: it reaches them through the tree-sitter CLI.
      - go test -count=1 -tags grammar ./test/queries/...

  test:vscode:
    desc: Run the VS Code TextMate grammar scope tests
    dir: editors/vscode
    cmds:
      - npm ci
      - npm test

  test:e2e:viewer:
    desc: Run viewer browser e2e tests against the static web bundle
    deps:
      - build:web
    dir: e2e-viewer
    cmds:
      - npm ci
      - npx playwright install --with-deps chromium
      - npx playwright test

  test:e2e:
    desc: Run e2e tests in Docker
    cmds:
      - docker build -f ./e2e/Dockerfile --build-arg EXECUTABLE=${EXECUTABLE} -t emod-e2e .
      - docker container run --rm -e EXECUTABLE=${EXECUTABLE} emod-e2e
    env:
      EXECUTABLE: ./dist/emod
