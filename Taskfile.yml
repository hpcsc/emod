version: '3'

includes:
  release: Taskfile.release.yml

tasks:
  build:
    desc: Build the emod binary
    deps:
      - build:wasm
    cmds:
      - mkdir -p ./bin
      - go build -o ./bin/emod ./cmd/emod
    env:
      CGO_ENABLED: '0'

  build:vscode:
    desc: Compile the VS Code extension (TypeScript → out/)
    dir: editors/vscode
    cmds:
      - npm ci
      - npm run compile

  setup:vscode:
    desc: Compile and symlink the VS Code extension
    deps:
      - build:vscode
    cmds:
      - mkdir -p ~/.vscode/extensions
      - rm -rf ~/.vscode/extensions/hpcsc.emod
      - ln -sf {{.PWD}}/editors/vscode ~/.vscode/extensions/hpcsc.emod

  build:wasm:
    desc: Build the WASM binary and copy runtime glue for the viewer
    cmds:
      - mkdir -p ./internal/viewer/generated
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./internal/viewer/generated/
      - go build -o ./internal/viewer/generated/emod.wasm ./cmd/emod-wasm
    env:
      CGO_ENABLED: '0'
      GOOS: 'js'
      GOARCH: 'wasm'

  build:web:
    desc: Assemble standalone deployment in web/
    deps:
      - build:wasm
    cmds:
      - mkdir -p ./web/generated ./web/static
      - cp -r ./internal/viewer/static/* ./web/static/
      - cp ./internal/viewer/generated/* ./web/generated/
      - mv ./web/static/viewer.html ./web/index.html

  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:viewer
      - task: test:grammar

  test:unit:
    desc: Run unit tests
    cmds:
      - go test -tags unit $(go list ./... | grep -v /cmd/emod-wasm)

  test:integration:
    desc: Run integration tests
    cmds:
      - go test -tags integration $(go list ./... | grep -v /cmd/emod-wasm)

  test:viewer:
    desc: Run viewer JS unit tests
    dir: internal/viewer
    cmds:
      - npm ci
      - npm test

  test:grammar:
    desc: Run the tree-sitter grammar corpus, highlight and editor query tests
    dir: editors/tree-sitter-emod
    cmds:
      - tree-sitter generate
      - tree-sitter test
      # -count=1 because the query files and grammar.js are inputs the Go test
      # cache never sees: it reaches them through the tree-sitter CLI.
      - go test -count=1 -tags grammar ./test/queries/...

  test:e2e:viewer:
    desc: Run viewer browser e2e tests against the static web bundle
    deps:
      - build:web
    dir: e2e-viewer
    cmds:
      - npm ci
      - npx playwright install --with-deps chromium
      - npx playwright test

  test:e2e:
    desc: Run e2e tests in Docker
    cmds:
      - docker build -f ./e2e/Dockerfile --build-arg EXECUTABLE=${EXECUTABLE} -t emod-e2e .
      - docker container run --rm -e EXECUTABLE=${EXECUTABLE} emod-e2e
    env:
      EXECUTABLE: ./dist/emod
