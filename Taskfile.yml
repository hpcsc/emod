version: '3'

includes:
  release: Taskfile.release.yml

tasks:
  build:
    desc: Build the emod binary
    deps:
      - build:wasm
    cmds:
      - mkdir -p ./bin
      - go build -o ./bin/emod ./cmd/emod
    env:
      CGO_ENABLED: '0'

  build:wasm:
    desc: Build the WASM binary and copy runtime glue for the viewer
    cmds:
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./internal/viewer/
      - go build -o ./internal/viewer/emod.wasm ./cmd/emod-wasm
    env:
      CGO_ENABLED: '0'
      GOOS: 'js'
      GOARCH: 'wasm'

  build:web:
    desc: Assemble standalone deployment in web/
    deps:
      - build:wasm
    cmds:
      - mkdir -p ./web
      - find ./internal/viewer -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' \) ! -name '*.test.js' ! -name 'vitest.config.js' -exec cp {} ./web/ \;
      - cp ./internal/viewer/emod.wasm ./web/
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./web/
      - mv ./web/viewer.html ./web/index.html

  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:viewer

  test:unit:
    desc: Run unit tests
    cmds:
      - go test -tags unit ./...

  test:integration:
    desc: Run integration tests
    cmds:
      - go test -tags integration ./...

  test:viewer:
    desc: Run viewer JS unit tests
    dir: internal/viewer
    cmds:
      - npm ci
      - npm test

  test:e2e:
    desc: Run e2e tests in Docker
    cmds:
      - docker build -f ./e2e/Dockerfile --build-arg EXECUTABLE=${EXECUTABLE} -t emod-e2e .
      - docker container run --rm -e EXECUTABLE=${EXECUTABLE} emod-e2e
    env:
      EXECUTABLE: ./dist/emod
