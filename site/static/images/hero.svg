<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" fill="none" role="img" aria-label="A command, an event pill and an automation connected by arrows">
  <defs>
    <linearGradient id="cmd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8ebf"/>
      <stop offset="1" stop-color="#4a6fa5"/>
    </linearGradient>
    <linearGradient id="evt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#d97b00"/>
    </linearGradient>
  </defs>

  <!-- background card -->
  <rect x="40" y="40" width="400" height="340" rx="20" fill="#f7f5fb" stroke="#e7e3ee" stroke-width="2"/>

  <!-- command block -->
  <g transform="translate(80 150)">
    <rect width="130" height="66" rx="10" fill="url(#cmd)"/>
    <rect x="16" y="16" width="72" height="9" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="16" y="33" width="98" height="9" rx="4" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- event pill -->
  <g transform="translate(175 120)">
    <rect width="150" height="54" rx="27" fill="url(#evt)"/>
    <rect x="26" y="18" width="70" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="26" y="32" width="52" height="8" rx="4" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- automation gear -->
  <g transform="translate(300 165)">
    <circle cx="44" cy="44" r="40" fill="#5f6b7a"/>
    <circle cx="44" cy="44" r="16" fill="#f7f5fb"/>
    <g fill="#5f6b7a">
      <rect x="40" y="8" width="8" height="16" rx="2"/>
      <rect x="40" y="64" width="8" height="16" rx="2"/>
      <rect x="8" y="40" width="16" height="8" rx="2"/>
      <rect x="64" y="40" width="16" height="8" rx="2"/>
      <rect x="18" y="18" width="14" height="8" rx="2" transform="rotate(-45 25 22)"/>
      <rect x="56" y="62" width="14" height="8" rx="2" transform="rotate(-45 63 66)"/>
      <rect x="56" y="18" width="14" height="8" rx="2" transform="rotate(45 63 22)"/>
      <rect x="18" y="62" width="14" height="8" rx="2" transform="rotate(45 25 66)"/>
    </g>
  </g>

  <!-- arrows -->
  <path d="M212 183 L172 174" stroke="#5f6b7a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M327 174 L347 168" stroke="#5f6b7a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5f6b7a"/>
    </marker>
  </defs>

  <!-- labels -->
  <text x="80" y="138" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#6b7a86">command</text>
  <text x="175" y="102" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#6b7a86">event</text>
  <text x="300" y="240" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#6b7a86">automation</text>
</svg>
