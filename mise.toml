[tools]
# Needed by the export tests that vet generated CUE against internal/cue/schema.cue.
# Without it those subtests skip, so the schema check never runs in CI.
cue = "0.14.1"
goreleaser = "2.15.4"
task = "3.51.1"
# Hugo resolves the Hextra theme as a Go module, so the site needs both pinned.
hugo-extended = "0.156.0"
go = "1.27.3"
