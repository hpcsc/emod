  }

  if (node.type === 'view') {
    if (node.subscribes && node.subscribes.length > 0) {
      html += '<div class="dp-section">';
      html += '<div class="dp-section-title">Subscribes To</div>';
      html += '<div>' + node.subscribes.map(function(s) { return esc(s); }).join(', ') + '</div>';
      html += '</div>';
    }
  }

  if (node.type === 'automation') {
    html += '<div class="dp-section">';
    html += '<div class="dp-section-title">Automation</div>';
    html += '<table><tbody>';
    html += '<tr><th>Trigger Event</th><td>' + esc(node.trigger_event || '—') + '</td></tr>';
    html += '<tr><th>Command</th><td>' + esc(node.command || '—') + '</td></tr>';
    html += '<tr><th>Target Context</th><td>' + esc(node.target_context || '—') + '</td></tr>';
    html += '</tbody></table>';
    html += '</div>';
  }

  if (node.type === 'translation') {
    html += '<div class="dp-section">';
    html += '<div class="dp-section-title">Translation</div>';
    html += '<table><tbody>';
    html += '<tr><th>External System</th><td>' + esc(node.external_system || '—') + '</td></tr>';
    html += '<tr><th>Reads</th><td>' + esc(node.reads || '—') + '</td></tr>';
    html += '<tr><th>Command</th><td>' + esc(node.command || '—') + '</td></tr>';
    if (node.event) {
      html += '<tr><th>Event</th><td>' + esc(node.event.name || '—') + '</td></tr>';
    }
    html += '</tbody></table>';
    html += '</div>';
  }

  // Source position
  if (node.position) {
    html += '<div class="dp-section">';
    html += '<div class="dp-section-title">Source</div>';
    html += '<div class="dp-source">' + esc(node.position.filename || '?') + ':' + (node.position.line || '?') + '</div>';
    html += '</div>';
  }

  content.innerHTML = html;

  if (isFieldNode) {
    // Blur handlers for field inputs — updates nodes[] so tooltips stay in sync
    content.querySelectorAll('.dp-field-input').forEach(function(input) {
      input.addEventListener('blur', function() {
        var idx = parseInt(this.dataset.idx);
        var field = this.dataset.field;
        var n = findNodeById(selectedNodeId);
        if (!n || !n.fields || !n.fields[idx]) return;
        n.fields[idx][field] = this.value;
      });
    });

    content.querySelectorAll('.dp-field-delete').forEach(function(btn) {
      btn.addEventListener('click', function(evt) {
        evt.stopPropagation();
        var idx = parseInt(this.dataset.idx);
        var n = findNodeById(selectedNodeId);
        if (!n || !n.fields) return;
        n.fields.splice(idx, 1);
        renderDiagram();
        showDetailPanel(n);
      });
    });

    var addBtn = content.querySelector('.dp-add-field');
    if (addBtn) {
      addBtn.addEventListener('click', function(evt) {
        evt.stopPropagation();
        var n = findNodeById(selectedNodeId);
        if (!n) return;
        if (!n.fields) n.fields = [];
        n.fields.push({name: '', type: 'string', modifier: ''});
        renderDiagram();
        showDetailPanel(n);
      });
    }
  }

  el.style.display = "block";

  // Suppress tooltip for the selected element
  hideTooltip();
}

function hideDetailPanel() {
  var el = document.getElementById("detail-panel");
  if (el) el.style.display = "none";
  selectedNodeId = null;
  clearHighlights();
}

// ─── Inline rename via double-click ───────────────────────────────────────
function startInlineEdit(nodeId) {
  var node = findNodeById(nodeId);
  if (!node) return;

  // Cancel any in-progress edit
  cancelInlineEdit();

  // Dismiss detail panel and highlights before entering edit mode
  hideDetailPanel();
  clearHighlights();

  var el = getNodeElement(nodeId, node.type);
  if (!el) return;

  var rect = el.getBoundingClientRect();

  var input = document.createElement("input");
  input.type = "text";
  input.value = node.label;
  input.style.position = "fixed";
  input.style.zIndex = "999";
  input.style.border = "2px solid #3498db";
  input.style.borderRadius = "4px";
  input.style.outline = "none";
  input.style.background = "#fff";
  input.style.fontFamily = "sans-serif";
  input.style.fontSize = "13px";
  input.style.padding = "2px 6px";
  input.style.boxSizing = "border-box";
  input.style.left = Math.max(4, rect.left - 4) + "px";
  input.style.top = Math.max(4, rect.top - 4) + "px";
  input.style.width = Math.max(rect.width + 8, 60) + "px";

  var isBlock = (node.type === "command" || node.type === "event" || node.type === "trigger" ||
                 node.type === "view" || node.type === "automation" || node.type === "translation");
  if (isBlock) {
    // For blocks, position the input centered within the node's bounding box
    var bw = Math.max(rect.width * 0.8, 80);
    input.style.left = Math.max(4, rect.left + (rect.width - bw) / 2) + "px";
    input.style.top = Math.max(4, rect.top + (rect.height - 28) / 2) + "px";
    input.style.width = bw + "px";
  }
  input.style.height = "28px";

  inlineEditState = {
    nodeId: nodeId,
    originalLabel: node.label,
    inputEl: input,
  };

  // ── Enter commits, Escape cancels ──
  input.addEventListener("keydown", function(evt) {
    if (evt.key === "Enter") {
      evt.preventDefault();
      if (!inlineEditState) return;
      var newLabel = input.value.trim() || inlineEditState.originalLabel;
      var n = findNodeById(inlineEditState.nodeId);
      if (n && newLabel !== n.label) {
        n.label = newLabel;
      }
      document.body.removeChild(input);
      inlineEditState = null;
      renderDiagram();
    } else if (evt.key === "Escape") {
      evt.preventDefault();
      cancelInlineEdit();
    }
  });

  // ── Blur commits but defers re-render to avoid clashing with in-flight events ──
  input.addEventListener("blur", function() {
    if (!inlineEditState) return;
    var newLabel = input.value.trim() || inlineEditState.originalLabel;
    var n = findNodeById(inlineEditState.nodeId);
    if (n && newLabel !== n.label) {
      n.label = newLabel;
    }
    document.body.removeChild(input);
    inlineEditState = null;
    setTimeout(renderDiagram, 0);
  });

  document.body.appendChild(input);
  input.focus();
  input.select();
}

function cancelInlineEdit() {
  if (!inlineEditState) return;
  document.body.removeChild(inlineEditState.inputEl);
  inlineEditState = null;
}

// ─── Highlighting ──────────────────────────────────────────────────────
function clearHighlights() {
  highlighted = {};
  svg.querySelectorAll(".hl").forEach(function(el) {
    el.classList.remove("hl");
  });
  svg.classList.remove("has-highlights");
}

function addHighlight(nodeId) {
  highlighted[nodeId] = true;
  var el = svg.querySelector('[data-node-id="' + nodeId + '"]');
  if (el) el.classList.add("hl");
  svg.classList.add("has-highlights");
}

function highlightElements(ids) {
  clearHighlights();
  ids.forEach(function(id) { addHighlight(id); });
}

// ─── Click handling via SVG event delegation ─────────────────────────────
svg.addEventListener("click", function(evt) {
  // Ignore panning clicks (dragged viewport, not clicked)
  if (panning) return;

  var target = evt.target;
  var interactive = false;

  // ── Context label click: highlight all children ──
  var ctxLabel = target.closest(".ctx-label");
  if (ctxLabel) {
    var ctxId = ctxLabel.getAttribute("data-ctx-id");
    if (ctxId) {
      interactive = true;
      var ids = getDescendantIds(ctxId);
      if (selectedNodeId) hideDetailPanel();
      highlightElements(ids);
    }
  }

  // ── Aggregate label click: highlight all elements within ──
  if (!interactive) {
    var aggLabel = target.closest(".agg-label");
    if (aggLabel) {
      var aggId = aggLabel.getAttribute("data-agg-id");
      if (aggId) {
        interactive = true;
        var ids = getDescendantIds(aggId);
        if (selectedNodeId) hideDetailPanel();
        highlightElements(ids);
      }
    }
  }

  // ── Edge arrow click: highlight source and target ──
  if (!interactive) {
    var arrow = target.closest(".flow-arrow, .sub-arrow, .auto-trg-arrow, .auto-cmd-arrow, .trg-cmd-arrow, .reads-arrow, .trans-cmd-arrow");
    if (arrow) {
      interactive = true;
      var src = arrow.getAttribute("data-source");
      var tgt = arrow.getAttribute("data-target");
      if (src && tgt) {
        if (selectedNodeId) hideDetailPanel();
        highlightElements([src, tgt]);
      }
    }
  }

  // ── Command/event block click: open detail panel (skip if click was actually a drag) ──
  if (!interactive && !suppressDetailClick) {
    var block = target.closest(".cmd-block, .evt-block, .trg-block, .view-block, .auto-block, .trans-block");
    if (block) {
      var nodeId = block.getAttribute("data-node-id");
      if (nodeId) {
        interactive = true;
        var node = findNodeById(nodeId);
        if (node) showDetailPanel(node);
      }
    }
  }
  // Reset drag-suppression flag regardless (avoids leaking to subsequent clicks)
  suppressDetailClick = false;

  // ── Background click: close panel and clear highlights ──
  if (!interactive) {
    // Don't close the detail panel if an input inside it is currently focused
    var activeEl = document.activeElement;
    var panelEl = document.getElementById("detail-panel");
    var inputFocused = panelEl && panelEl.style.display !== "none" && activeEl &&
      panelEl.contains(activeEl) && (activeEl.tagName === "INPUT" || activeEl.tagName === "SELECT");
    if (!inputFocused) {
      hideDetailPanel();
      clearHighlights();
    }
  }
});

// ── Double-click: inline rename ──
svg.addEventListener("dblclick", function(evt) {
  var target = evt.target;

  // Block double-click (command, event, trigger, view, automation, translation)
  var block = target.closest(".cmd-block, .evt-block, .trg-block, .view-block, .auto-block, .trans-block");
  if (block) {
    var nodeId = block.getAttribute("data-node-id");
    if (nodeId) { evt.preventDefault(); startInlineEdit(nodeId); return; }
  }

  // Context label double-click
  var ctxLabel = target.closest(".ctx-label");
  if (ctxLabel) {
    var ctxId = ctxLabel.getAttribute("data-ctx-id");
    if (ctxId) { evt.preventDefault(); startInlineEdit(ctxId); return; }
  }

  // Aggregate label double-click
  var aggLabel = target.closest(".agg-label");
  if (aggLabel) {
    var aggId = aggLabel.getAttribute("data-agg-id");
    if (aggId) { evt.preventDefault(); startInlineEdit(aggId); return; }
  }

  // Slice header double-click
  var sliceHeader = target.closest(".slice-header");
  if (sliceHeader) {
    var sliceId = sliceHeader.getAttribute("data-slice-id");
    if (sliceId) { evt.preventDefault(); startInlineEdit(sliceId); return; }
  }
});

// ── Context menu: right-click on slice header/area, context header, aggregate row, or labels ──
svg.addEventListener("contextmenu", function(evt) {
  var target = evt.target;

  // ── Slice header right-click: show slice context menu ──
  var sliceHeader = target.closest(".slice-header");
  if (sliceHeader) {
    var sliceId = sliceHeader.getAttribute("data-slice-id");
    if (sliceId) {
      evt.preventDefault();
      showContextMenu(evt.clientX, evt.clientY, null, sliceId);
      return;
    }
  }

  // ── Slice empty area right-click: show slice context menu ──
  var sliceArea = target.closest(".slice-area");
  if (sliceArea) {
    var sliceId = sliceArea.getAttribute("data-slice-id");
    if (sliceId) {
      evt.preventDefault();
      showContextMenu(evt.clientX, evt.clientY, null, sliceId);
      return;
    }
  }

  // Block right-click: do not suppress default browser menu
  var block = target.closest(".cmd-block, .evt-block, .trg-block, .view-block, .auto-block, .trans-block");
  if (block) return;

  // Check aggregate content area (transparent backdrop rects)
  var aggArea = target.closest(".agg-area");
  if (aggArea) {
    var aggId = aggArea.getAttribute("data-agg-id");
    if (aggId) {
      evt.preventDefault();
      showContextMenu(evt.clientX, evt.clientY, aggId);
      return;
    }
  }

  var aggLabel = target.closest(".agg-label");
  if (aggLabel) {
    var aggId = aggLabel.getAttribute("data-agg-id");
    if (aggId) {
      evt.preventDefault();
      showContextMenu(evt.clientX, evt.clientY, aggId);
      return;
    }
  }

  var ctxHeader = target.closest(".ctx-header");
  if (ctxHeader) {
    var ctxId = ctxHeader.getAttribute("data-ctx-id");
    if (ctxId) {
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].type === "aggregate" && nodes[i].parentId === ctxId) {
          evt.preventDefault();
          showContextMenu(evt.clientX, evt.clientY, nodes[i].id);
          return;
        }
      }
    }
  }

  var ctxLabel = target.closest(".ctx-label");
  if (ctxLabel) {
    var ctxId = ctxLabel.getAttribute("data-ctx-id");
    if (ctxId) {
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].type === "aggregate" && nodes[i].parentId === ctxId) {
          evt.preventDefault();
          showContextMenu(evt.clientX, evt.clientY, nodes[i].id);
          return;
        }
      }
    }
  }
});

function showContextMenu(x, y, aggId, sliceId) {
  var el = document.getElementById("ctx-menu");
  if (!el) return;
  if (aggId) {
    ctxMenuState = { targetAggId: aggId };
    el.innerHTML = '<div class="ctx-menu-item" data-action="add-slice">Add Slice</div>';
  } else if (sliceId) {
    ctxMenuState = { targetSliceId: sliceId };
    el.innerHTML = [
      '<div class="ctx-menu-item" data-action="add-command">Add Command</div>',
      '<div class="ctx-menu-item" data-action="add-event">Add Event</div>',
      '<div class="ctx-menu-item" data-action="add-flow">Add Flow</div>',
    ].join('');
  }
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.display = "block";
}

function hideContextMenu() {
  var el = document.getElementById("ctx-menu");
  if (el) el.style.display = "none";
  ctxMenuState = null;
}

// ── Context menu actions via event delegation ──
document.getElementById("ctx-menu").addEventListener("click", function(evt) {
  var item = evt.target.closest(".ctx-menu-item");
  if (!item) return;
  var action = item.getAttribute("data-action");

  if (action === "add-slice") {
    if (!ctxMenuState || !ctxMenuState.targetAggId) return;
    var aggId = ctxMenuState.targetAggId;

    var sliceId = generateNodeId("slice");
    var existingSlices = nodes.filter(function(n) {
      return n.parentId === aggId && n.type === "slice";
    });
    nodes.push({
      id: sliceId,
      type: "slice",
      label: generateLabel("slice", existingSlices),
      parentId: aggId,
    });

    hideContextMenu();
    renderDiagram();
    return;
  }

  if (action === "add-command") {
    if (!ctxMenuState || !ctxMenuState.targetSliceId) return;
    var sliceId = ctxMenuState.targetSliceId;

    var cmdId = generateNodeId("cmd");
    var existingCmds = nodes.filter(function(n) {
      return n.parentId === sliceId && n.type === "command";
    });
    nodes.push({
      id: cmdId,
      type: "command",
      label: generateLabel("command", existingCmds),
      parentId: sliceId,
    });

    hideContextMenu();
    renderDiagram();
    return;
  }

  if (action === "add-event") {
    if (!ctxMenuState || !ctxMenuState.targetSliceId) return;
    var sliceId = ctxMenuState.targetSliceId;

    var evtId = generateNodeId("evt");
    var existingEvts = nodes.filter(function(n) {
      return n.parentId === sliceId && n.type === "event";
    });
    nodes.push({
      id: evtId,
      type: "event",
      label: generateLabel("event", existingEvts),
      parentId: sliceId,
    });

    hideContextMenu();
    renderDiagram();
    return;
  }

  if (action === "add-flow") {
    if (!ctxMenuState || !ctxMenuState.targetSliceId) return;
    var sliceId = ctxMenuState.targetSliceId;

    var cmds = nodes.filter(function(n) {
      return n.parentId === sliceId && n.type === "command";
    });

    var evtId = generateNodeId("evt");
    var existingEvts = nodes.filter(function(n) {
      return n.parentId === sliceId && n.type === "event";
    });
    nodes.push({
      id: evtId,
      type: "event",
      label: generateLabel("event", existingEvts),
      parentId: sliceId,
    });

    var sourceId;
    if (cmds.length > 0) {
      sourceId = cmds[cmds.length - 1].id;
    } else {
      sourceId = generateNodeId("cmd");
      nodes.push({
        id: sourceId,
        type: "command",
        label: "new-command",
        parentId: sliceId,
      });
    }

    edges.push({
      source: sourceId,
      target: evtId,
      type: "flow",
    });

    hideContextMenu();
    renderDiagram();
    return;
  }
});

// ── Dismiss context menu on outside click ──
document.addEventListener("click", function(evt) {
  var menu = document.getElementById("ctx-menu");
  if (menu && menu.style.display !== "none" && !menu.contains(evt.target)) {
    hideContextMenu();
  }
});

// ── Escape key: blur focused field input, cancel inline edit, dismiss context menu, or close panel ──
document.addEventListener("keydown", function(evt) {
  if (evt.key === "Escape") {
    // If a detail panel input is focused, blur it instead of closing panel
    var activeEl = document.activeElement;
    var panelEl = document.getElementById("detail-panel");
    if (panelEl && panelEl.style.display !== "none" && activeEl && panelEl.contains(activeEl) &&
        (activeEl.tagName === "INPUT" || activeEl.tagName === "SELECT")) {
      activeEl.blur();
      return;
    }
    if (inlineEditState) {
      cancelInlineEdit();
    } else if (ctxMenuState) {
      hideContextMenu();
    } else {
      hideDetailPanel();
      clearHighlights();
    }
  }
});

// ── Close button on detail panel ──
document.getElementById("dp-close").addEventListener("click", function(evt) {
  evt.stopPropagation();
  hideDetailPanel();
});
</script>
